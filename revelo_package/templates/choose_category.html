{%extends'base.html' %}
{% block title%}
Category
{% endblock%}
{% block content%}

    {% for category in categories%}
    <a class="image-container" href="{{url_for('post_page',category_id=category.id)}}">
  <img src="{{ url_for('static', filename='uploads/categories/'+category.id|string+'.jpg') }}" alt="A description of your image">
  <div class="overlay-text"> <h2>{{category.name}}</h2></div>
    </a>
    
       
    {% endfor%}
{% endblock%}
