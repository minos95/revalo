{%extends'base.html' %}
{% block title%}
Category
{% endblock%}
{% block content%}
<div class="row">


    {% for category in categories%}
    <div class="col-md-4 mt-5">
    <a class="image-container" href="{{url_for('market_page',category_id=category.id)}}">
  <img src="{{ url_for('static', filename='uploads/categories/'+category.id|string+'.jpg') }}" alt="A description of your image">
  <div class="overlay-text"> <h2>{{category.name}}</h2></div>
    </a>
    </div>
    
    {% endfor%}
</div> 
{% endblock%}
