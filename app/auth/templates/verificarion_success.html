{% extends "base.html" %}

{% block title %}Email Verified - EcoWaste{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center bg-gray-50 py-12 px-4">
    <div class="max-w-md w-full">
        
        <div class="bg-white rounded-xl shadow-lg overflow-hidden">
            
            <!-- Header -->
            <div class="bg-gradient-to-r from-green-500 to-green-600 px-6 py-6 text-center">
                <div class="w-20 h-20 bg-white rounded-full flex items-center justify-center mx-auto mb-4">
                    <i class="fas fa-check-circle text-4xl text-green-600"></i>
                </div>
                <h1 class="text-2xl font-bold text-white">Email Verified!</h1>
                <p class="text-green-100 text-sm mt-1">Your account is now active</p>
            </div>
            
            <div class="p-6 text-center">
                <p class="text-gray-600 mb-6">
                    Thank you for verifying your email address. You can now start using EcoWaste.
                </p>
                
                <div class="flex flex-col space-y-3">
                    <a href="{{ url_for('auth.login') }}" 
                       class="bg-green-600 text-white px-6 py-3 rounded-lg hover:bg-green-700 transition font-medium">
                        Login
                    </a>
                    
                </div>
            </div>
            
        </div>
    </div>
</div>
{% endblock %}
