name: Deploy to Azure VM

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Deploy to Azure VM
        env:
          SSH_PRIVATE_KEY: ${{ secrets.AZURE_SSH_PRIVATE_KEY }}
          SSH_USER: ${{ secrets.AZURE_SSH_USER }}
          VM_IP: ${{ secrets.AZURE_VM_IP }}
        run: |
          echo "🔑 Setting up SSH..."
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          
          ssh-keyscan -H $VM_IP >> ~/.ssh/known_hosts 2>/dev/null
          
          echo "📁 Creating directory on VM..."
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no $SSH_USER@$VM_IP "mkdir -p /home/$SSH_USER/ecowaste"
          
          echo "📤 Copying files..."
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -r \
            ./app \
            ./templates \
            ./static \
            ./run.py \
            ./requirements.txt \
            $SSH_USER@$VM_IP:/home/$SSH_USER/ecowaste/
          
          echo "🔄 Running deployment commands..."
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no $SSH_USER@$VM_IP << 'ENDSSH'
            cd /home/$SSH_USER/ecowaste
            
            # Create virtual environment if needed
            if [ ! -d "venv" ]; then
              python3 -m venv venv
            fi
            
            source venv/bin/activate
            pip install --upgrade pip
            pip install -r requirements.txt
            
            if [ -d "migrations" ]; then
              flask db upgrade
            fi
            
            sudo systemctl restart ecowaste
            echo "✅ Deployment completed!"
          ENDSSH