name: Deploy to Azure VM

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Deploy to Azure VM
        env:
          SSH_PRIVATE_KEY: ${{ secrets.AZURE_SSH_PRIVATE_KEY }}
          SSH_USER: ${{ secrets.AZURE_SSH_USER }}
          VM_IP: ${{ secrets.AZURE_VM_IP }}
        run: |
          echo "🔑 Setting up SSH..."
          
          # Create .ssh directory
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          
          # Write the private key (Azure .pem format works directly)
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          
          # Add VM to known hosts
          ssh-keyscan -H $VM_IP >> ~/.ssh/known_hosts 2>/dev/null
          
          echo "📦 Testing connection..."
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no $SSH_USER@$VM_IP "echo '✅ Connected to VM successfully!'"
          
          echo "📤 Copying application files..."
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -r \
            ./app \
            ./templates \
            ./static \
            ./run.py \
            ./requirements.txt \
            $SSH_USER@$VM_IP:/home/$SSH_USER/ecowaste/
          
          echo "🔄 Running deployment commands..."
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no $SSH_USER@$VM_IP << 'ENDSSH'
            cd /home/$SSH_USER/ecowaste
            
            # Check if virtual environment exists
            if [ ! -d "venv" ]; then
              echo "📦 Creating virtual environment..."
              python3 -m venv venv
            fi
            
            # Activate and install dependencies
            source venv/bin/activate
            pip install --upgrade pip
            pip install -r requirements.txt
            
            # Run migrations if migration folder exists
            if [ -d "migrations" ]; then
              flask db upgrade
            fi
            
            # Restart the application
            echo "🔄 Restarting Gunicorn..."
            sudo systemctl restart ecowaste || echo "⚠️ Gunicorn service not found"
            
            echo "✅ Deployment completed!"
          ENDSSH