name: Deploy to Azure VM

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Deploy to Azure VM
        env:
          SSH_PRIVATE_KEY: ${{ secrets.AZURE_SSH_PRIVATE_KEY }}
          SSH_USER: ${{ secrets.AZURE_SSH_USER }}
          VM_IP: ${{ secrets.AZURE_VM_IP }}
        run: |
          echo "🔑 Setting up SSH..."
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          
          ssh-keyscan -H $VM_IP >> ~/.ssh/known_hosts 2>/dev/null
          
          echo "📦 Creating deployment package..."
          # Create tar archive (excluding unnecessary files)
          tar -czf deploy.tar.gz \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='__pycache__' \
            --exclude='*.pyc' \
            --exclude='venv' \
            --exclude='.env' \
            --exclude='.pytest_cache' \
            --exclude='instance' \
            .
          
          echo "📁 Creating directory on VM..."
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no $SSH_USER@$VM_IP "mkdir -p /home/$SSH_USER/ecowaste"
          
          echo "📤 Copying archive to VM..."
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no deploy.tar.gz $SSH_USER@$VM_IP:/home/$SSH_USER/
          
          echo "📦 Extracting on VM..."
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no $SSH_USER@$VM_IP << 'ENDSSH'
            cd /home/$SSH_USER
            mkdir -p ecowaste_temp
            tar -xzf deploy.tar.gz -C ecowaste_temp/
            
            # Move files to final location
            rm -rf ecowaste
            mv ecowaste_temp ecowaste
            rm deploy.tar.gz
            
            cd ecowaste
            
            # Create virtual environment if needed
            if [ ! -d "venv" ]; then
              python3 -m venv venv
            fi
            
            source venv/bin/activate
            pip install --upgrade pip
            pip install -r requirements.txt
            
            if [ -d "migrations" ]; then
              flask db upgrade
            fi
            
            sudo systemctl restart ecowaste
            echo "✅ Deployment completed!"
          ENDSSH