name: Deploy to Azure VM

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Deploy to Azure VM
        env:
          SSH_PRIVATE_KEY: ${{ secrets.AZURE_SSH_PRIVATE_KEY }}
          SSH_USER: ${{ secrets.AZURE_SSH_USER }}
          VM_IP: ${{ secrets.AZURE_VM_IP }}
        run: |
          set -e  # Exit on error
          
          echo "🔑 Setting up SSH..."
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          
          echo "Adding VM to known hosts..."
          ssh-keyscan -H $VM_IP >> ~/.ssh/known_hosts 2>/dev/null
          
          echo "🔍 Testing SSH connection..."
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no $SSH_USER@$VM_IP "echo '✅ SSH connection successful'"
          
          echo "📁 Creating directory with sudo..."
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no $SSH_USER@$VM_IP "sudo mkdir -p /home/$SSH_USER/ecowaste && sudo chown $SSH_USER:$SSH_USER /home/$SSH_USER/ecowaste"
          
          echo "📤 Copying application files..."
          # Copy each directory individually
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -r ./app $SSH_USER@$VM_IP:/home/$SSH_USER/ecowaste/
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no ./requirements.txt $SSH_USER@$VM_IP:/home/$SSH_USER/ecowaste/
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no ./extensions.py $SSH_USER@$VM_IP:/home/$SSH_USER/ecowaste/
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no ./app.py $SSH_USER@$VM_IP:/home/$SSH_USER/ecowaste/
          echo "🔄 Running deployment commands..."
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no $SSH_USER@$VM_IP << 'ENDSSH'
            cd /home/$SSH_USER/ecowaste
            
            # Check if files were copied
            echo "📁 Files on VM:"
            ls -la
            
            # Create virtual environment
            if [ ! -d "venv" ]; then
              echo "📦 Creating virtual environment..."
              python3 -m venv venv
            fi
            
            # Activate and install
            . venv/bin/activate
            echo "📦 Installing dependencies..."
            pip install --upgrade pip
            pip install -r requirements.txt
            
            # Run migrations
            if [ -d "migrations" ]; then
              echo "🗄️ Running database migrations..."
              flask db upgrade
            fi
            
            # Restart application
            echo "🔄 Restarting application..."
            sudo systemctl restart ecowaste || echo "⚠️ Gunicorn service not found"
            
            echo "✅ Deployment completed successfully!"
          ENDSSH